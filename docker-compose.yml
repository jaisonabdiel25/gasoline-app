version: '3'
services:
  gasolineAPP:
    image: postgres:15.3
    container_name: gasoline-app
    restart: always
    ports:
      - 5433:5432
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=gasolineDB
    volumes:
      - ./postgres:/var/lib/postgresql/data
